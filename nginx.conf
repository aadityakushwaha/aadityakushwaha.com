server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Astro emits /writing/slug/index.html. Serving index.html directly avoids the
  # 301-to-trailing-slash hop that `$uri/` would cause on every article link.
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  # The contact endpoint is a Cloudflare Pages Function and has no runtime on
  # this host. Answer in the shape the form expects so it can show a real
  # message rather than falling through to an HTML 404.
  location = /api/contact {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"ok":false,"error":"The form is not wired up on this host yet — please email work.aadityak@gmail.com and I will reply within a day."}';
  }

  # Hashed build assets are immutable; images are not.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /img/ {
    expires 7d;
    add_header Cache-Control "public";
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # Basic hardening. No CSP here: the site loads Google Fonts and inline
  # styles, so a wrong CSP breaks the page silently — worth doing separately.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}
